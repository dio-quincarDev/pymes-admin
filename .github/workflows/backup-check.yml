name: Backup - Verificación diaria

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 04:00 America/Panama, 1 h después del backup
  workflow_dispatch:

permissions: {}

jobs:
  check-latest-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar backup reciente en OCI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-bogota-1
          S3_BUCKET: oci-bucket-dev
          S3_ENDPOINT: https://axdavdsyzzpz.compat.objectstorage.sa-bogota-1.oraclecloud.com
          S3_PREFIX: pymes/stg   # cambiar a pymes/prod cuando entre producción
        run: |
          set -euo pipefail
          latest=$(aws s3api list-objects-v2 \
            --bucket "$S3_BUCKET" \
            --prefix "$S3_PREFIX/" \
            --endpoint-url "$S3_ENDPOINT" \
            --query 'sort_by(Contents || `[]`, &LastModified)[-1].LastModified' \
            --output text)
          if [ -z "$latest" ] || [ "$latest" = "None" ]; then
            echo "No hay backups en s3://$S3_BUCKET/$S3_PREFIX/"
            exit 1
          fi
          latest_epoch=$(date -u -d "$latest" +%s)
          now_epoch=$(date -u +%s)
          age_h=$(( (now_epoch - latest_epoch) / 3600 ))
          echo "Último backup: $latest ($age_h h)"
          if [ "$age_h" -gt 26 ]; then
            echo "El último backup tiene más de 26 h"
            exit 1
          fi
