name: CD - Deploy to Staging
run-name: Deploy staging de ${{ github.event.workflow_run.head_branch }} por @${{ github.event.workflow_run.actor.login }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [develop]

jobs:
  # ==================== BUILD & TEST ====================
  build-and-test:
    name: Build and Test
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4 # v4.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Auth Backend
        working-directory: ./backend/auth
        run: mvn clean package -DskipTests -B

      - name: Build Core Backend
        working-directory: ./backend/core
        run: mvn clean package -DskipTests -B

      - name: Build Gateway Backend
        working-directory: ./backend/gateway-pymes
        run: mvn clean package -DskipTests -B

      - name: Generate version
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Upload Auth JAR artifact
        uses: actions/upload-artifact@v4 # v4.5.0
        with:
          name: auth-service-jar
          path: backend/auth/target/*.jar
          retention-days: 1

      - name: Upload Core JAR artifact
        uses: actions/upload-artifact@v4 # v4.5.0
        with:
          name: core-service-jar
          path: backend/core/target/*.jar
          retention-days: 1

      - name: Upload Gateway JAR artifact
        uses: actions/upload-artifact@v4 # v4.5.0
        with:
          name: gateway-service-jar
          path: backend/gateway-pymes/target/*.jar
          retention-days: 1

  # ==================== FRONTEND BUILD ====================
  frontend-build:
    name: Build Frontend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4 # v4.2.0
        with:
          path: frontend/pymes/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/pymes/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./frontend/pymes
        run: npm ci

      - name: Build Quasar
        working-directory: ./frontend/pymes
        run: npx quasar build

  # ==================== DOCKER BUILD & PUSH ====================
  docker-build-push:
    name: Build and Push Docker Images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-build]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.8.0

      - name: Build and push Auth image (Staging)
        uses: docker/build-push-action@v5 # v6.9.0
        with:
          context: ./backend/auth
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pymes-auth:staging
            ${{ secrets.DOCKER_USERNAME }}/pymes-auth:${{ needs.build-and-test.outputs.version }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-auth:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-auth:buildcache,mode=max

      - name: Build and push Core image (Staging)
        uses: docker/build-push-action@v5 # v6.9.0
        with:
          context: ./backend/core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pymes-core:staging
            ${{ secrets.DOCKER_USERNAME }}/pymes-core:${{ needs.build-and-test.outputs.version }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-core:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-core:buildcache,mode=max

      - name: Build and push Gateway image (Staging)
        uses: docker/build-push-action@v5 # v6.9.0
        with:
          context: ./backend/gateway-pymes
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pymes-gateway:staging
            ${{ secrets.DOCKER_USERNAME }}/pymes-gateway:${{ needs.build-and-test.outputs.version }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-gateway:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-gateway:buildcache,mode=max

      - name: Build and push Frontend image (Staging)
        uses: docker/build-push-action@v5 # v6.9.0
        with:
          context: ./frontend/pymes
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pymes-frontend:staging
            ${{ secrets.DOCKER_USERNAME }}/pymes-frontend:${{ needs.build-and-test.outputs.version }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pymes-frontend:buildcache,mode=max

  # ==================== DEPLOY TO STAGING ====================
  deploy-staging:
    name: Deploy to Staging Server
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push]
    permissions:
      contents: read
    environment:
      name: staging
      url: http://staging.pymes-admin.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Deploying version: ${{ needs.build-and-test.outputs.version }}"

            cd ~/pymes-admin
            git pull origin develop

            cat > .env <<EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            TAG=${{ needs.build-and-test.outputs.version }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_STAGING }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
            SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
            OAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -af

      - name: Verify deployment
        run: |
          echo "Deployment to staging triggered successfully."
