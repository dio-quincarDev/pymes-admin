name: CD - Deploy to Production
run-name: Deploy prod de ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }} por @${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.workflow_run.actor.login }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        default: 'latest'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ==================== VERSION ====================
  build-and-test:
    name: Generate Version
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate version
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

  # ==================== DOCKER BUILD AMD64 ====================
  docker-build-amd64:
    name: Build Docker Images (amd64)
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push Auth (amd64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/auth
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-auth:latest-amd64
            ${{ env.DOCKER_USERNAME }}/pymes-auth:prod-amd64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-auth:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-auth:buildcache-v2,mode=max

      - name: Build and push Core (amd64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/core
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-core:latest-amd64
            ${{ env.DOCKER_USERNAME }}/pymes-core:prod-amd64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-core:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-core:buildcache-v2,mode=max

      - name: Build and push Gateway (amd64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/gateway-pymes
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-gateway:latest-amd64
            ${{ env.DOCKER_USERNAME }}/pymes-gateway:prod-amd64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-gateway:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-gateway:buildcache-v2,mode=max

      - name: Build and push Frontend (amd64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend/pymes
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-frontend:latest-amd64
            ${{ env.DOCKER_USERNAME }}/pymes-frontend:prod-amd64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-frontend:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-frontend:buildcache-v2,mode=max

  # ==================== DOCKER BUILD ARM64 ====================
  docker-build-arm64:
    name: Build Docker Images (arm64)
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push Auth (arm64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/auth
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-auth:latest-arm64
            ${{ env.DOCKER_USERNAME }}/pymes-auth:prod-arm64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-auth:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-auth:buildcache-v2,mode=max

      - name: Build and push Core (arm64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/core
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-core:latest-arm64
            ${{ env.DOCKER_USERNAME }}/pymes-core:prod-arm64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-core:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-core:buildcache-v2,mode=max

      - name: Build and push Gateway (arm64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/gateway-pymes
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-gateway:latest-arm64
            ${{ env.DOCKER_USERNAME }}/pymes-gateway:prod-arm64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-gateway:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-gateway:buildcache-v2,mode=max

      - name: Build and push Frontend (arm64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend/pymes
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/pymes-frontend:latest-arm64
            ${{ env.DOCKER_USERNAME }}/pymes-frontend:prod-arm64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-frontend:buildcache-v2
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/pymes-frontend:buildcache-v2,mode=max

  # ==================== DOCKER MANIFEST ====================
  docker-manifest:
    name: Create Manifest Lists
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-amd64, docker-build-arm64]
    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Create Auth manifest
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_USERNAME }}/pymes-auth:latest \
            -t ${{ env.DOCKER_USERNAME }}/pymes-auth:prod \
            ${{ env.DOCKER_USERNAME }}/pymes-auth:latest-amd64 \
            ${{ env.DOCKER_USERNAME }}/pymes-auth:latest-arm64

      - name: Create Core manifest
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_USERNAME }}/pymes-core:latest \
            -t ${{ env.DOCKER_USERNAME }}/pymes-core:prod \
            ${{ env.DOCKER_USERNAME }}/pymes-core:latest-amd64 \
            ${{ env.DOCKER_USERNAME }}/pymes-core:latest-arm64

      - name: Create Gateway manifest
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_USERNAME }}/pymes-gateway:latest \
            -t ${{ env.DOCKER_USERNAME }}/pymes-gateway:prod \
            ${{ env.DOCKER_USERNAME }}/pymes-gateway:latest-amd64 \
            ${{ env.DOCKER_USERNAME }}/pymes-gateway:latest-arm64

      - name: Create Frontend manifest
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_USERNAME }}/pymes-frontend:latest \
            -t ${{ env.DOCKER_USERNAME }}/pymes-frontend:prod \
            ${{ env.DOCKER_USERNAME }}/pymes-frontend:latest-amd64 \
            ${{ env.DOCKER_USERNAME }}/pymes-frontend:latest-arm64

  # ==================== DEPLOY TO PRODUCTION ====================
  deploy-production:
    name: Deploy to Production Server
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-manifest]
    permissions:
      contents: read
    environment:
      name: production
      url: https://pymes-admin.com

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy via SSH
        if: secrets.PROD_HOST != '' && secrets.PROD_USER != '' && secrets.PROD_SSH_KEY != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Deploying version: ${{ needs.build-and-test.outputs.version }}"

            cd ~/pymes-admin
            git pull origin main

            cat > .env <<EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            TAG=${{ needs.build-and-test.outputs.version }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_PROD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
            SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
            OAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -af

            echo "Deploy to Production completed successfully!"

      - name: Skip deployment (secrets not configured)
        if: secrets.PROD_HOST == '' || secrets.PROD_USER == '' || secrets.PROD_SSH_KEY == ''
        run: |
          echo "Production server secrets not configured. Skipping SSH deployment."
          echo "Docker images were built and pushed successfully."
          echo "To enable full deploy, configure PROD_HOST, PROD_USER and PROD_SSH_KEY secrets."

      - name: Notify success
        if: success()
        run: |
          echo "Production build and docker push successful."
          echo "Version: ${{ needs.build-and-test.outputs.version }}"
