name: CI - Build and Test
run-name: CI en ${{ github.ref_name }} por @${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/**
      - develop
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==================== SECURITY CHECK ====================
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .env files in repo
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "::error::ALERTA DE SEGURIDAD: Archivos .env encontrados en el repositorio"
            git ls-files | grep '\.env$'
            exit 1
          fi
          echo "No hay archivos .env trackeados"

      - name: Scan for secrets (API keys, passwords)
        run: |
          echo "Buscando patrones de secretos..."
          PATTERNS=(
            "api[_-]?key[[:space:]]*[:=]"
            "password[[:space:]]*[:=]"
            "secret[[:space:]]*[:=]"
            "token[[:space:]]*[:=]"
            "private[_-]?key"
          )

          FOUND=false
          for pattern in "${PATTERNS[@]}"; do
            if git grep -i "$pattern" -- '*.env*' '*.yml' '*.yaml' '*.json' '*.properties' 2>/dev/null; then
              FOUND=true
            fi
          done

          if [ "$FOUND" = true ]; then
            echo "::warning::Posibles secretos encontrados. Verifica que no sean valores de ejemplo."
          else
            echo "No se encontraron patrones sospechosos obvios"
          fi

  # ==================== UNIT TESTS AUTH ====================
  backend-auth-unit-test:
    name: Unit Tests Auth
    runs-on: ubuntu-latest
    needs: security-check
    env:
      MAVEN_OPTS: -Xmx512m
    defaults:
      run:
        working-directory: ./backend/auth

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test -B

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-unit-test-results
          path: backend/auth/target/surefire-reports/
          retention-days: 7

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'backend/auth/target/surefire-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

  # ==================== INTEGRATION TESTS AUTH ====================
  backend-auth-integration-test:
    name: Integration Tests Auth
    runs-on: ubuntu-latest
    needs: backend-auth-unit-test
    env:
      MAVEN_OPTS: -Xmx512m
    defaults:
      run:
        working-directory: ./backend/auth

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and Run Integration Tests
        run: ./mvnw verify -B -Dspring.profiles.active=integration -Ddocker.client.api.version=1.44

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: backend/auth/target/*.jar
          retention-days: 7

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-integration-test-results
          path: backend/auth/target/failsafe-reports/
          retention-days: 7

      - name: Publish Integration Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'backend/auth/target/failsafe-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

  # ==================== UNIT TESTS CORE ====================
  backend-core-unit-test:
    name: Unit Tests Core
    runs-on: ubuntu-latest
    needs: security-check
    env:
      MAVEN_OPTS: -Xmx512m
    defaults:
      run:
        working-directory: ./backend/core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test -B

  # ==================== GATEWAY BUILD ====================
  backend-gateway-build:
    name: Build and Test Gateway
    runs-on: ubuntu-latest
    needs: security-check
    env:
      MAVEN_OPTS: -Xmx512m
    defaults:
      run:
        working-directory: ./backend/gateway-pymes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw test -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-service-jar
          path: backend/gateway-pymes/target/*.jar
          retention-days: 7

  # ==================== FRONTEND BUILD ====================
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: security-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/pymes/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/pymes/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./frontend/pymes
        run: npm ci

      - name: Lint
        working-directory: ./frontend/pymes
        run: npm run lint

      - name: Build
        working-directory: ./frontend/pymes
        run: npx quasar build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/pymes/dist/
          retention-days: 7

  # ==================== DOCKER BUILD ====================
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-auth-integration-test, backend-core-unit-test, backend-gateway-build, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Auth Docker image (test)
        run: |
          docker build -t pymes-auth-test ./backend/auth

      - name: Build Core Docker image (test)
        run: |
          docker build -t pymes-core-test ./backend/core

      - name: Build Gateway Docker image (test)
        run: |
          docker build -t pymes-gateway-test ./backend/gateway-pymes

      - name: Build Frontend Docker image (test)
        run: |
          docker build -t pymes-frontend-test ./frontend/pymes

      - name: Cleanup
        run: |
          docker rmi pymes-auth-test pymes-core-test pymes-gateway-test pymes-frontend-test || true
