name: CI - Build and Test
run-name: CI en ${{ github.ref_name }} por @${{ github.actor }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/**
      - develop
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci.yml'

jobs:
  # ==================== SECURITY CHECK ====================
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check for .env files in repo
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "::error::ALERTA DE SEGURIDAD: Archivos .env encontrados en el repositorio"
            git ls-files | grep '\.env$'
            exit 1
          fi
          echo "No hay archivos .env trackeados"

      - name: Scan for secrets (API keys, passwords)
        run: |
          echo "Buscando patrones de secretos..."
          PATTERNS=(
            "api[_-]?key[[:space:]]*[:=]"
            "password[[:space:]]*[:=]"
            "secret[[:space:]]*[:=]"
            "token[[:space:]]*[:=]"
            "private[_-]?key"
          )

          FOUND=false
          for pattern in "${PATTERNS[@]}"; do
            if git grep -i "$pattern" -- '*.env*' '*.yml' '*.yaml' '*.json' '*.properties' 2>/dev/null; then
              FOUND=true
            fi
          done

          if [ "$FOUND" = true ]; then
            echo "::warning::Posibles secretos encontrados. Verifica que no sean valores de ejemplo."
          else
            echo "No se encontraron patrones sospechosos obvios"
          fi

  # ==================== UNIT TESTS AUTH ====================
  backend-auth-unit-test:
    name: Unit Tests Auth
    runs-on: ubuntu-latest
    needs: security-check
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx512m
    defaults:
      run:
        working-directory: ./backend/auth

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test -B

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: auth-unit-test-results
          path: backend/auth/target/surefire-reports/
          retention-days: 7

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: always()
        with:
          report_paths: 'backend/auth/target/surefire-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

  # ==================== INTEGRATION TESTS AUTH ====================
  backend-auth-integration-test:
    name: Integration Tests Auth
    runs-on: ubuntu-latest
    needs: backend-auth-unit-test
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx512m
      TESTCONTAINERS_RYUK_DISABLED: "true"
    defaults:
      run:
        working-directory: ./backend/auth

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Precache Testcontainers images
        run: |
          docker pull postgres:15-alpine
          docker pull redis:7-alpine

      - name: Build and Run Integration Tests
        run: ./mvnw verify -B -Dspring.profiles.active=integration -Dsurefire.skip=true -Ddocker.client.api.version=1.44

      - name: Upload JAR artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: auth-service-jar
          path: backend/auth/target/*.jar
          retention-days: 7

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: auth-integration-test-results
          path: backend/auth/target/failsafe-reports/
          retention-days: 7

      - name: Publish Integration Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: always()
        with:
          report_paths: 'backend/auth/target/failsafe-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

  # ==================== UNIT TESTS CORE ====================
  backend-core-unit-test:
    name: Unit Tests Core
    runs-on: ubuntu-latest
    needs: security-check
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx512m
      TESTCONTAINERS_RYUK_DISABLED: "true"
    defaults:
      run:
        working-directory: ./backend/core

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Precache Testcontainers image
        run: docker pull postgres:15-alpine

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test -B

  # ==================== INTEGRATION TESTS CORE ====================
  backend-core-integration-test:
    name: Integration Tests Core
    runs-on: ubuntu-latest
    needs: backend-core-unit-test
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx512m
      TESTCONTAINERS_RYUK_DISABLED: "true"
    defaults:
      run:
        working-directory: ./backend/core

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Precache Testcontainers images
        run: |
          docker pull postgres:15-alpine
          docker pull redis:7-alpine

      - name: Build and Run Integration Tests
        run: ./mvnw verify -B -Dspring.profiles.active=integration -Dsurefire.skip=true -Ddocker.client.api.version=1.44

      - name: Upload JAR artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: core-service-jar
          path: backend/core/target/*.jar
          retention-days: 7

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: core-integration-test-results
          path: backend/core/target/failsafe-reports/
          retention-days: 7

      - name: Publish Integration Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: always()
        with:
          report_paths: 'backend/core/target/failsafe-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

  # ==================== GATEWAY BUILD ====================
  backend-gateway-build:
    name: Build and Test Gateway
    runs-on: ubuntu-latest
    needs: security-check
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx512m
    defaults:
      run:
        working-directory: ./backend/gateway-pymes

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw test -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: gateway-service-jar
          path: backend/gateway-pymes/target/*.jar
          retention-days: 7

  # ==================== FRONTEND BUILD ====================
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: security-check
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: frontend/pymes/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/pymes/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./frontend/pymes
        run: npm ci

      - name: Lint
        working-directory: ./frontend/pymes
        run: npm run lint

      - name: Build
        working-directory: ./frontend/pymes
        run: npx quasar build

      - name: Upload build artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: frontend-build
          path: frontend/pymes/dist/
          retention-days: 7


