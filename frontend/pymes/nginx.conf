# =============================================================================
# PyMes Admin - Nginx Configuration for Quasar PWA/SPA
# =============================================================================

server {
    listen 9200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets (JS, CSS, images, fonts)
    # ponytail: .svg excluded — logos/icons change on branding updates, 1y cache
    # serves stale logo after redeploy. JS/CSS hashed by Vite, safe to immutably cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|otf|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SVGs — no cache, they change with branding updates (no content hash in filename)
    location ~* \.svg$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    # Service Worker - no cache
    # Ponytail: ^~ overrides the .js regex location above — sw.js MUST bypass
    # the immutable (1y) rule or the browser never re-downloads the new SW
    # and keeps serving stale precache forever.
    location ^~ /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        access_log off;
    }

    # SPA fallback - all routes go to index.html
    # Ponytail: index.html must NEVER be cached — otherwise browsers serve stale
    # bundles after redeploy (the classic PWA issue). no-cache + revalidate.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files (except .well-known for Let's Encrypt)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ /.well-known {
        allow all;
    }
}
