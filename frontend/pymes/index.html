<!doctype html>
<html lang="es-MX">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <meta name="theme-color" content="#0B1210" />
    <meta name="robots" content="index, follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="PYMEQ — Gestión Financiera Inteligente para PYMES" />
    <meta property="og:description" content="Organiza tu empresa y toma el control. Gestión de facturas, productos y gastos en un solo lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PYMEQ" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PYMEQ — Gestión Financiera Inteligente para PYMES" />
    <meta name="twitter:description" content="Organiza tu empresa y toma el control. Gestión de facturas, productos y gastos en un solo lugar." />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
