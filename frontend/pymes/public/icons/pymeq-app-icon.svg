<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pymeq app icon</title>
  <desc id="desc">Pymeq application icon using the dark fintech palette and bronze growth mark.</desc>

  <rect width="512" height="512" rx="112" fill="#080900"/>
  <rect x="20" y="20" width="472" height="472" rx="96"
        fill="#12141A" stroke="#353945" stroke-width="4"/>

  <!-- Swiss/grid-inspired segmented orbital frame -->
  <path d="M256 64 A192 192 0 0 1 430 174"
        fill="none" stroke="#1E2129" stroke-width="18"/>
  <path d="M448 218 A192 192 0 0 1 338 430"
        fill="none" stroke="#1E2129" stroke-width="18"/>
  <path d="M302 443 A192 192 0 0 1 82 330"
        fill="none" stroke="#1E2129" stroke-width="18"/>
  <path d="M70 290 A192 192 0 0 1 150 101"
        fill="none" stroke="#1E2129" stroke-width="18"/>

  <!-- Accent segments -->
  <path d="M334 91 A192 192 0 0 1 405 137"
        fill="none" stroke="#C8963E" stroke-width="18"/>
  <circle cx="405" cy="137" r="9" fill="#C8963E"/>

  <!-- Q -->
  <circle cx="235" cy="248" r="112" fill="none" stroke="#F5F5F2" stroke-width="34"/>
  <!-- Q tail / financial trend -->
  <path d="M235 325 L286 376 L382 280"
        fill="none" stroke="#C8963E" stroke-width="30"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <circle cx="382" cy="280" r="15" fill="#C8963E"/>

  <!-- Small balancing node -->
  <circle cx="99" cy="374" r="8" fill="#C8963E"/>
</svg>
