<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PymeQ</title>
    <style>
        body { margin: 0; padding: 0; background-color: #08090D; font-family: 'Geist', 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        @media only screen and (max-width: 600px) { .container { width: 100% !important; } }
        .email-btn { display: inline-block; background-color: #C8963E; color: #08090D !important; padding: 14px 28px; font-size: 15px; font-weight: 700; text-decoration: none; border-radius: 6px; margin: 24px 0; }
        .email-divider { border: none; border-top: 1px solid #353945; margin: 25px 0; }
    </style>
</head>
<body>
<div th:fragment="page(content)">
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; padding:40px 0; table-layout:fixed; background-color:#08090D;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#12141A; border-radius:6px; overflow:hidden;">
                    <tr>
                        <td style="padding:32px 40px 12px; text-align:center; border-bottom:1px solid #353945;">
                            <span style="font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif; font-size:20px; font-weight:800; color:#C8963E; letter-spacing:-0.01em;">PYMEQ</span>
                            <p style="margin:4px 0 0; font-family:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif; font-size:11px; font-weight:500; color:#6B6863; letter-spacing:0.08em; text-transform:uppercase;">by QCore System</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:40px; line-height:1.6;">
                            <th:block th:insert="${content}" />
                        </td>
                    </tr>
                </table>
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; padding:24px 0;">
                    <tr>
                        <td align="center">
                            <p style="margin:0; font-family:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif; font-size:13px; color:#6B6863;">PymeQ by QCore System &mdash; 2026</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
