<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="email/fragments/layout :: head"></head>
<body>
<div th:replace="email/fragments/layout :: page(~{::.content-body})">
    <div class="content-body">
        <p style="margin:0 0 8px; font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif; font-size:20px; font-weight:700; color:#F5F3EF;" th:text="${name} != null ? 'Hola ' + ${name} : 'Hola'">Hola</p>
        <p style="margin:0 0 24px; font-family:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif; font-size:15px; color:#9B9790; line-height:1.6;">Gracias por registrarte en PymeQ. Verifica tu correo para activar tu cuenta.</p>
        <table width="100%" cellpadding="0" cellspacing="0">
            <tr>
                <td align="center" style="padding:8px 0 24px;">
                    <a th:href="${url}" class="email-btn" style="display:inline-block; background-color:#C8963E; color:#08090D !important; padding:14px 28px; font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif; font-size:15px; font-weight:700; text-decoration:none; border-radius:6px; margin:24px 0;">VERIFICAR CUENTA</a>
                </td>
            </tr>
        </table>
        <hr class="email-divider" style="border:none; border-top:1px solid #353945; margin:25px 0;">
        <p style="margin:0; font-family:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif; font-size:13px; color:#6B6863; line-height:1.5;">Este enlace expira en 15 minutos. Si no creaste esta cuenta, ignora este mensaje.</p>
    </div>
</body>
</html>
