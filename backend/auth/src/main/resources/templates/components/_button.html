<div xmlns:th="http://www.thymeleaf.org" th:fragment="button(url, text)">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <a th:href="${url}" class="btn-width" style="display:inline-block; background-color:#A3785E; color:#ffffff; padding:16px 32px; font-size:15px; font-weight:600; text-decoration:none; border-radius:8px; letter-spacing:-0.2px;" th:text="${text}">Acceder</a>
            </td>
        </tr>
    </table>
</div>
