<div xmlns:th="http://www.thymeleaf.org" th:fragment="alert(title, message)" style="background-color:#141F1C; border-left:3px solid #71837F; padding:16px 20px; border-radius:0 6px 6px 0; margin:24px 0;">
    <p style="margin:0; font-size:13px; font-weight:600; color:#E2E8E4; letter-spacing:0.5px;" th:text="${title}">IMPORTANTE</p>
    <p style="margin:8px 0 0; font-size:14px; color:#A8B3B0; line-height:1.5;" th:text="${message}">Mensaje de alerta aquí.</p>
</div>
