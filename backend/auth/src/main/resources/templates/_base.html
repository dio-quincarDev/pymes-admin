<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PymeQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base */
        body { margin: 0; padding: 0; background-color: #0B1210; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        a { text-decoration: none; }
        
        /* Responsive */
        @media only screen and (max-width: 640px) {
            .container { width: 100% !important; }
            .content-padding { padding: 24px 20px !important; }
            .header-padding { padding: 24px 20px !important; }
            .footer-padding { padding: 24px 20px !important; }
            .btn-width { width: 100% !important; display: block !important; }
            .hide-mobile { display: none !important; }
        }
    </style>
</head>
<body th:fragment="layout(content)" style="margin:0; padding:0; background-color:#0B1210; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;">
    <!-- Wrapper -->
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; background-color:#0B1210; padding:40px 0; table-layout:fixed;">
        <tr>
            <td align="center">
                <!-- Main Container -->
                <table class="container" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; width:600px; background-color:#1B2624; border-radius:12px; overflow:hidden;">
                    
                    <!-- Header -->
                    <tr>
                        <td class="header-padding" style="padding:36px 40px 32px; text-align:center; border-bottom:1px solid #2A3633;">
                            <!-- Logo/Brand -->
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center">
                                        <span style="font-size:28px; font-weight:700; color:#A3785E; letter-spacing:-0.5px;">PymeQ</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="content-padding" th:replace="${content}" style="padding:40px 40px 32px; line-height:1.6;"></td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer-padding" style="padding:28px 40px 36px; text-align:center; border-top:1px solid #2A3633;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center">
                                        <p style="margin:0; font-size:12px; color:#71837F;">&copy; 2026 PymeQ. Todos los derechos reservados.</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top:12px;">
                                        <p style="margin:0; font-size:11px; color:#4A5553;">Gestión inteligente para tu negocio.</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
