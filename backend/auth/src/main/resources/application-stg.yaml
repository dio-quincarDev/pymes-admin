# Perfil de Staging (QA / Pre-producción)
server:
  port: 8081

# Todas las configuraciones críticas deben ser inyectadas por variables de entorno (Secrets)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=auth
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: false

jwt:
  access-expiration: 3600000
  refresh-expiration: 86400000

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS}"

logging:
  level:
    root: INFO
    auth.pymes: INFO
