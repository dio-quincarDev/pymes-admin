# Perfil de Producción
server:
  port: 8081

# Forzar configuración externa estricta
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=auth
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: false

  # Swagger deshabilitado por defecto en producción (override con SWAGGER_ENABLED=true)
  springdoc:
    swagger-ui:
      enabled: ${SWAGGER_ENABLED:false}
    api-docs:
      enabled: ${SWAGGER_ENABLED:false}

jwt:
  access-expiration: 3600000 # 1 hour
  refresh-expiration: 86400000 # 24 hours

# Actuator: no revelar detalles en producción
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    auth.pymes: INFO
    org.springframework: WARN
