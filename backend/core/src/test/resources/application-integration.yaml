spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: core
        format_sql: true
  flyway:
    enabled: true
    schemas: core
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 0

management:
  health:
    redis:
      enabled: false
