# Gateway Perfil Desarrollo Local
server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/v1/**
          filters:
            - PreserveHostHeader
            - AuthenticationFilter

        - id: auth-service-oauth2
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/oauth2/**, /login/oauth2/**, /login/**, /v3/api-docs/auth
          filters:
            - PreserveHostHeader

        # Swagger/OpenAPI spec - Auth Service (public)
        # Naming convention: /v3/api-docs/{service-name}
        - id: swagger-api-docs-auth
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/v3/api-docs/auth

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    dev.dioquincar: DEBUG
