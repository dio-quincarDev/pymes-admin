server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: @spring.profiles.active@
  application:
    name: pymes-gateway

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: auth-public
          uri: http://${AUTH_SERVICE_HOST}:8081
          predicates:
            - Path=/api/v1/auth/register, /api/v1/auth/login, /api/v1/auth/refresh, /api/v1/oauth2/**, /api/v1/login/**
          filters:
            - PreserveHostHeader

        - id: auth-protected
          uri: http://${AUTH_SERVICE_HOST}:8081
          predicates:
            - Path=/api/v1/auth/logout, /api/v1/auth/me, /api/v1/tenants/**, /api/v1/invitations/**
          filters:
            - PreserveHostHeader
            - AuthenticationFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:"*"}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
