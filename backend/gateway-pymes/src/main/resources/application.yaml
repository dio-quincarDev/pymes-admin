server:
  port: 8080

spring:
  application:
    name: pymes-gateway

  # Redis Configuration (Reactive)
  data:
    redis:
      host: ${REDIS_HOST:pymes-redis-auth}
      port: 6379

  cloud:
    gateway:
      routes:
        # ==================== PUBLIC AUTH ROUTES ====================
        - id: auth-public
          uri: http://${AUTH_SERVICE_HOST:pymes-auth-service}:8081
          predicates:
            - Path=/api/v1/auth/register, /api/v1/auth/login, /api/v1/auth/refresh, /api/v1/oauth2/**, /api/v1/login/**
          filters:
            - PreserveHostHeader

        # ==================== PROTECTED AUTH ROUTES ====================
        - id: auth-protected
          uri: http://${AUTH_SERVICE_HOST:pymes-auth-service}:8081
          predicates:
            - Path=/api/v1/auth/logout, /api/v1/auth/me, /api/v1/tenants/**, /api/v1/invitations/**
          filters:
            - PreserveHostHeader
            - AuthenticationFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

# WARNING: NEVER commit real secrets to this file. 
# Use environment variables for production (JWT_SECRET).
jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_SECURE_KEY_IN_ENV}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
