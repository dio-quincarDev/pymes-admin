services:
  # ==================== FRONTEND (Quasar PWA) ====================
  frontend:
    image: ${DOCKER_USERNAME:-pymes}/pymes-frontend:${TAG:-latest}
    build:
      context: ./frontend/pymes
      dockerfile: Dockerfile
    container_name: pymes-frontend
    restart: on-failure
    networks:
      - proxy-caddy-network
    ports:
      - "${FRONTEND_PORT:-9200}:9200"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9200/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== API GATEWAY ====================
  gateway:
    image: ${DOCKER_USERNAME:-pymes}/pymes-gateway:${TAG:-latest}
    build:
      context: ./backend/gateway-pymes
      dockerfile: Dockerfile
    container_name: pymes-gateway
    restart: on-failure
    networks:
      - proxy-caddy-network
      - pymes-internal-network
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - AUTH_SERVICE_HOST=pymes-auth-service
      - REDIS_HOST=pymes-redis-auth
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:9000}
      - SERVER_PORT=8080
      - CORE_SERVICE_HOST=pymes-core-service
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key-in-production-minimum-256-bits}
      - JAVA_OPTS=-Xmx384m -Xms256m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== AUTH SERVICE ====================
  auth-service:
    image: ${DOCKER_USERNAME:-pymes}/pymes-auth:${TAG:-latest}
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    container_name: pymes-auth-service
    restart: on-failure
    networks:
      - pymes-internal-network
    environment:
      - DB_HOST=pymes-postgres-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=pymes-redis-auth
      - REDIS_PORT=6379
      - SERVER_PORT=8081
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - JAVA_OPTS=-Xmx384m -Xms256m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # ==================== CORE SERVICE ====================
  core-service:
    image: ${DOCKER_USERNAME:-pymes}/pymes-core:${TAG:-latest}
    build:
      context: ./backend/core
      dockerfile: Dockerfile
    container_name: pymes-core-service
    restart: on-failure
    networks:
      - pymes-internal-network
    environment:
      - DB_HOST=pymes-postgres-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=pymes-redis-auth
      - REDIS_PORT=6379
      - SERVER_PORT=8082
      - AUTH_SERVICE_URL=http://pymes-auth-service:8081
      - JAVA_OPTS=-Xmx384m -Xms256m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # ==================== DATABASE (PostgreSQL) ====================
  postgres:
    image: postgres:15-alpine
    container_name: pymes-postgres-db
    restart: on-failure
    networks:
      - pymes-internal-network
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pymes-postgres-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== CACHE (Redis) ====================
  redis:
    image: redis:7-alpine
    container_name: pymes-redis-auth
    restart: on-failure
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - pymes-internal-network
    volumes:
      - pymes-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==================== VOLUMES ====================
volumes:
  pymes-postgres-db-data:
    external: false
  pymes-redis-data:
    external: false

# ==================== NETWORKS ====================
networks:
  proxy-caddy-network:
    external: true
  pymes-internal-network:
