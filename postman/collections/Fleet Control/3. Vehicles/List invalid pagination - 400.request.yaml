$kind: http-request
name: List invalid pagination -> 400
description: Returns 400 Bad Request when page is negative.
url: "{{baseUrl}}/api/vehicles?page=-1&size=20"
method: GET
queryParams:
  page: "-1"
  size: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("List invalid pagination -> 400 Bad Request", function () {
          pm.response.to.have.status(400);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("VALIDATION_ERROR");
      });
    language: text/javascript
order: 3000
