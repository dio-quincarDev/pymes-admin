$kind: http-request
description: Fetches a deterministic vehicle from the demo seed (vehicle-1).
url: "{{baseUrl}}/api/vehicles/99b5202f-f181-3828-9461-3571f0f67f94"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get seed vehicle -> 200 OK", function () {
          pm.response.to.have.status(200);
          var json = pm.response.json();
          pm.expect(json.plate).to.eql("2137KLM");
          pm.expect(json.status).to.eql("AVAILABLE");
      });
    language: text/javascript
order: 4000
