$kind: http-request
name: Get missing driver -> 404
description: Returns 404 DRIVER_NOT_FOUND when driver UUID is not found.
url: "{{baseUrl}}/api/drivers/00000000-0000-0000-0000-000000000000"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get missing driver -> 404 Not Found", function () {
          pm.response.to.have.status(404);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("DRIVER_NOT_FOUND");
      });
    language: text/javascript
order: 5000
