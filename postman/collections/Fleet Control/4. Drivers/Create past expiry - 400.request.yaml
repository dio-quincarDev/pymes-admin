$kind: http-request
name: Create past expiry -> 400
description: Returns 400 VALIDATION_ERROR when license expiration date is in the past.
url: "{{baseUrl}}/api/drivers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Postman Past",
      "email": "postman.past@example.com",
      "phone": "+34 600 444 557",
      "licenseNumber": "DL-PM-PAST",
      "licenseCategory": "B",
      "licenseExpiresAt": "2020-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Create past expiry -> 400 Bad Request", function () {
          pm.response.to.have.status(400);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("VALIDATION_ERROR");
      });
    language: text/javascript
order: 8000
