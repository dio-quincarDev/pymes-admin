$kind: http-request
name: Create duplicate license -> 409
description: Returns 409 DRIVER_ALREADY_EXISTS when using a license number that already exists.
url: "{{baseUrl}}/api/drivers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Postman Dup",
      "email": "postman.dup@example.com",
      "phone": "+34 600 444 556",
      "licenseNumber": "DL-DEMO-0001",
      "licenseCategory": "B",
      "licenseExpiresAt": "2028-05-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Create duplicate license -> 409 Conflict", function () {
          pm.response.to.have.status(409);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("DRIVER_ALREADY_EXISTS");
      });
    language: text/javascript
order: 7000
