$kind: http-request
name: Route not found -> 404
description: Verifies 404 response on an unmapped gateway path.
url: "{{baseUrl}}/api/non-existent-route"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Route not found returns 404", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 4000
