$kind: http-request
description: Gateway health and downstream services liveness check (always returns 200, public, no auth required).
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Health status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Gateway reports UP and services map", function () {
          var json = pm.response.json();
          pm.expect(json.gateway).to.eql("UP");
          pm.expect(json).to.have.property("services");
          pm.expect(json.services).to.be.an("object");
      });
    language: text/javascript
order: 1000
