$kind: http-request
name: Register validation error (weak password) -> 400
description: Password must be at least 8 chars with an uppercase letter and a number.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "weak_user",
      "email": "weak.user@fleetcontrol.com",
      "password": "short"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Register weak password -> 400 Bad Request", function () {
          pm.response.to.have.status(400);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("VALIDATION_ERROR");
          pm.expect(json).to.have.property("details");
      });
    language: text/javascript
order: 3000
