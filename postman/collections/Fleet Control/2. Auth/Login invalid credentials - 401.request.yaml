$kind: http-request
name: Login invalid credentials -> 401
description: Returns 401 Unauthorized with INVALID_CREDENTIALS.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "Wrong_Password_123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login invalid credentials -> 401 Unauthorized", function () {
          pm.response.to.have.status(401);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("INVALID_CREDENTIALS");
      });
    language: text/javascript
order: 5000
