$kind: http-request
name: Login validation error (invalid email) -> 400
description: Returns 400 Bad Request when email or password format is invalid.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "not-a-valid-email",
      "password": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login validation error -> 400 Bad Request", function () {
          pm.response.to.have.status(400);
          var json = pm.response.json();
          pm.expect(json.error).to.eql("VALIDATION_ERROR");
      });
    language: text/javascript
order: 6000
